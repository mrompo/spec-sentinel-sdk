name: fixture
# Banco de pruebas del framework: toda regla dura tiene un test que la falsifica.
# Fase 0: estructura + symlinks + cambio OpenSpec activo. Cada fase añade su job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixture:
    name: Fixture (${{ matrix.os }})
    # macOS trae bash 3.2 + BSD sed/grep; Linux bash 5 + GNU. El SDK promete ambos.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Estructura, symlinks, cambio activo y guardarraíles
        run: bash fixture/verify.sh
