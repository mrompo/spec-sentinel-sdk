# sentinel/policy.default.yaml — LA política distribuida del SDK (puesto Centinela)
#
# Viene con el SDK y `setup` la actualiza: no la edites en tu proyecto (se sobrescribe, con
# backup). Tus reglas van en sentinel/policy.yaml. De todas las reglas que matchean, en las dos
# políticas, gana la decisión más estricta (block > confirm > warn; a igualdad, la primera, y
# las de este fichero van antes): el consumidor solo puede AÑADIR protección, nunca quitarla, y
# repetir aquí un id es un error de política (opción A del slice 6 de git-gates,
# SC-sentinel-guard-17..21).
#
# Esquema v1 (plano, parseable con bash+sed — sin dependencias), igual en las dos políticas:
#   sdd: true|false            → nivel Método activo (habilita reglas con requires_sdd). Lo
#                                declara el consumidor; si no lo hace, vale el de este fichero
#   rules:                     → lista de reglas; de las que matchean, GANA LA MÁS ESTRICTA
#                                (a igualdad, la primera)
#     - id:            único y obligatorio en las dos políticas (lo referencia overrides.log)
#       tool:          regex sobre tool_name (Bash, Edit|Write, …)
#       command_re:    regex sobre el comando (solo tool Bash)
#       path_re:       regex sobre file_path (tools de fichero)
#       content_re:    regex sobre el contenido escrito
#       branch_re:     regex sobre la rama git actual
#       only_if_no_active_change: true → solo aplica si NO hay cambio OpenSpec activo
#       requires_sdd:  true → solo aplica con sdd: true
#       mode:          block | confirm | warn
#       reason:        motivo mostrado al denegar/avisar
#
# Modos: block → exit 2 con motivo · confirm → pide aprobación humana para esa acción (el
# permiso del harness) · warn → pasa dejando aviso.
# Break-glass (block/confirm): SENTINEL_OVERRIDE="<motivo>" permite la acción y la registra
# en sentinel/overrides.log (fichero versionado; doctor lo reporta — KPI de overrides).

version: 1
# Nivel Guardia por defecto: el nivel Método lo activa cada proyecto en su policy.yaml
sdd: false

rules:
  # ── autoprotección: el guardarraíl no se desarma a sí mismo ────────────────
  # (hallazgo #1 del panel adversarial: sin esto, una sola escritura anula el Centinela)
  - id: self-protection
    tool: Bash|Edit|Write|MultiEdit|NotebookEdit
    # La llave (.override) también: si el agente pudiera escribirla, se concedería a sí mismo
    # el break-glass (hallazgo del 2026-09-30, SC-git-gates-14). La Esclusa entra con sus hooks,
    # su librería y el lector del adaptador (SC-git-gates-15); su README y el stack.yaml del
    # consumidor siguen siendo editables. Las dos políticas, la distribuida y la del consumidor.
    # Segunda revisión de git-gates (SC-sentinel-guard-13): el fragmento de cableado que la
    # persona copia a mano, y los hooks donde queda encadenada la Esclusa (husky y .git/hooks).
    # Cuarta revisión: la configuración de git donde vive core.hooksPath, la del repo (también
    # de un worktree o un submódulo) y la global; desde un comando ya la cubre no-hook-disabling.
    # Quinta revisión: la configuración de jq de la persona (~/.jq), que jq carga en cada
    # programa; setup ya la aísla, y así tampoco la escribe el agente. Solo la de la carpeta
    # personal (~, $HOME, /Users/<persona>, /home/<persona>, /root): un .jq de un proyecto, no.
    # El instalador tiene sus propias reglas (protect-installer, install-needs-human).
    # AGENTS.md no va aquí: en un consumidor es suyo; el SDK lo protege en su propia policy.yaml.
    path_re: (sentinel/(hooks/|githooks/(commit-msg|pre-commit|pre-push|lib/)|adapters/stack\.sh|policy(\.default)?\.yaml|overrides\.log|\.override|settings\.fragment\.json)|\.husky/(commit-msg|pre-commit|pre-push)|\.git/hooks/|\.git/(worktrees/[^/]+/|modules/.+/)?config|\.gitconfig|\.config/git/config|(~|\$HOME|\$\{HOME\}|(^|[[:space:]"'=])(/(Users|home)/[^/[:space:]]+|/root))/\.jq([^[:alnum:]._-]|$)|\.claude/settings)
    mode: block
    reason: No se modifica ni borra el propio enforcement (Centinela, Esclusa, política, llave, bitácora, cableado) — hazlo en un cambio OpenSpec revisado por un humano

  # El instalador es lo que ejecuta la aprobación humana de instalar: con las herramientas de
  # edición no se toca (SC-sentinel-guard-13). Por sus dos rutas: la copia del SDK a la que
  # apunta el consumidor (…/ai-specs/skills/setup/) y el enlace de la skill que propone la guía
  # (~/.claude/skills/spec-sentinel-setup/). Una skill «setup» propia del consumidor no es el
  # instalador. Desde la shell lo decide una persona (install-needs-human).
  - id: protect-installer
    tool: Edit|Write|MultiEdit|NotebookEdit
    path_re: (ai-specs/skills/setup|\.claude/skills/spec-sentinel-setup)/(setup|chain)\.sh
    mode: block
    reason: No se modifica el instalador del SDK — hazlo en un cambio OpenSpec revisado por un humano

  - id: no-hook-disabling
    tool: Bash
    # Cualquier SENTINEL_* (override, políticas, binarios de prueba, el jq del instalador…):
    # una lista cerrada se queda corta en cuanto aparece una variable nueva (SC-sentinel-guard-13)
    command_re: (--no-verify|core\.hooksPath|HUSKY=0|SENTINEL_[A-Z_]+=)
    mode: block
    reason: No se desactivan los gates ni se auto-conceden overrides desde un comando — el break-glass lo aplica un humano en su propio entorno

  # Ejecutar el instalador reescribe el enforcement y el cableado, y desde la shell también se
  # podría modificar: cualquier comando que lo nombre, por cualquiera de sus dos rutas, lo
  # aprueba una persona viendo el comando (SC-sentinel-guard-21). Leerlo con las herramientas de
  # lectura no lo pide. Como gana la regla más estricta, esta aprobación no rebaja ningún bloqueo
  # del mismo comando.
  - id: install-needs-human
    tool: Bash
    command_re: (ai-specs/skills/setup|\.claude/skills/spec-sentinel-setup)/(setup|chain)\.sh
    mode: confirm
    reason: El comando ejecuta o toca el instalador del SDK, que reescribe el enforcement y el cableado — lo aprueba una persona

  # ── gitflow ────────────────────────────────────────────────────────────────
  - id: protected-branches
    tool: Bash
    command_re: (^|[;&|(]|&&)[[:space:]]*git([[:space:]]+(-[^[:space:]]+|[a-zA-Z-]+=[^[:space:]]+))*[[:space:]]+(commit|merge|cherry-pick|rebase|revert|am|apply)([[:space:]]|$)
    branch_re: ^(main|master|development|preproduction|production)$
    mode: block
    reason: Rama protegida — crea una rama feature/fix/hotfix (guía docs/guia-uso.md §ciclo)

  - id: branch-switch-and-commit
    tool: Bash
    command_re: git[[:space:]]+(checkout|switch)[[:space:]]+(-[^[:space:]]+[[:space:]]+)*(main|master|development|preproduction|production)([[:space:]]|$)
    mode: confirm
    reason: Cambio a rama protegida en el mismo comando (el guard evalúa la rama ANTES de ejecutar — ver limitaciones en sentinel/README.md)

  - id: no-force-push
    tool: Bash
    command_re: git([[:space:]]+(-[^[:space:]]+|[a-zA-Z-]+=[^[:space:]]+))*[[:space:]]+push([[:space:]]+.*)?([[:space:]](--force|--force-with-lease|--mirror|--delete|-f|-d)([[:space:]]|$)|[[:space:]]\+[^[:space:]]*:|[[:space:]]:[^[:space:]]+)
    mode: block
    reason: Reescritura o borrado de rama remota (force, mirror, delete o refspec con '+'/':') — prohibido

  # ── ficheros gestionados por tooling ──────────────────────────────────────
  # path_re matchea también contra el comando Bash (hallazgo #4: sed/tee/cp tocan
  # ficheros protegidos sin traer file_path)
  - id: managed-files
    tool: Bash|Edit|Write|MultiEdit|NotebookEdit
    path_re: (CHANGELOG\.md|package-lock\.json|[^[:space:]]+\.lock|openspec/specs/)
    mode: block
    reason: Fichero gestionado por tooling (semantic-release / lockfiles / specs archivadas via openspec archive)

  # ── QA: el agente no debilita la suite (plan §7.1) ─────────────────────────
  - id: protect-tests
    tool: Edit|Write|MultiEdit|NotebookEdit
    path_re: ((^|/)(tests?|spec|specs|e2e|cypress|__tests__)/|\.(test|spec|cy)\.[a-z]+|Test\.php$)
    content_re: \.[[:space:]\\n]*(skip|only|todo|skipIf)[[:space:]\\n]*\(|x(describe|it|test)[[:space:]\\n]*\(
    mode: block
    reason: No se debilita la suite (.skip/.only/.todo) — si un test sobra, su cambio OpenSpec debe ampararlo

  - id: protect-tests-bash
    tool: Bash
    command_re: (rm|mv)[[:space:]]+[^|;&]*((^|/)(tests?|spec|specs|e2e|cypress)/|\.(test|spec|cy)\.[a-z]+|Test\.php)|sed[[:space:]]+.*(skip|only)\(
    mode: block
    reason: No se borran, renombran ni desactivan tests desde shell — su cambio OpenSpec debe ampararlo

  - id: coverage-thresholds
    tool: Bash|Edit|Write|MultiEdit
    path_re: (jest\.config|vitest\.config|phpunit\.xml|\.nycrc|codecov\.ya?ml)
    mode: warn
    reason: Tocas configuración de tests/cobertura — asegúrate de que el cambio activo lo ampara

  # ── SDD (solo con sdd: true) ───────────────────────────────────────────────
  - id: spec-guard
    requires_sdd: true
    only_if_no_active_change: true
    tool: Edit|Write|MultiEdit
    path_re: ^src/
    mode: warn
    reason: Edición de código sin cambio OpenSpec activo — abre el change antes (spec-guard en warn, decisión plan §11)

  # ── destructivos y aislamiento ────────────────────────────────────────────
  - id: destructive
    tool: Bash
    command_re: (^|[;&|])[[:space:]]*rm[[:space:]]+([^|;&]*[[:space:]])?-[a-zA-Z-]*([rR]|-recursive)|rm[[:space:]]+.*--force|find[[:space:]]+.*-delete|[Dd][Rr][Oo][Pp][[:space:]]+([Tt][Aa][Bb][Ll][Ee]|[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee])|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee][[:space:]]+[Tt][Aa][Bb][Ll][Ee]|[Dd][Ee][Ll][Ee][Tt][Ee][[:space:]]+[Ff][Rr][Oo][Mm]|migrate:(fresh|reset)|git[[:space:]]+reset[[:space:]]+--(hard|keep)|git[[:space:]]+clean[[:space:]]+-[a-zA-Z]*[fdx]
    mode: confirm
    reason: Comando destructivo — requiere confirmación humana explícita

  - id: isolation-env
    tool: Bash|Read|Grep|Edit|Write|MultiEdit
    path_re: \.env\.?(prod|production|pre|preproduction|staging)
    mode: block
    reason: Aislamiento — el agente no toca entornos productivos (aplica también al MCP de Boost)

# Regla pendiente de la fase 6 (necesita identidad de subagente, aún no disponible):
#   design-ownership: solo el software-architect edita openspec/changes/*/design.md
