# sentinel/policy.yaml — la política de ESTE proyecto (puesto Centinela).
# Las reglas del SDK viven en sentinel/policy.default.yaml y setup las actualiza. Aquí solo se
# AÑADEN reglas propias (mismo esquema): entre las dos políticas gana la decisión más estricta,
# y un id del SDK repetido es un error de política. Fichero protegido: se cambia en un cambio
# revisado por una persona.
version: 1
# Este repo trabaja con OpenSpec: nivel Método
sdd: true

rules:
  # El mapa de instrucciones de los agentes de ESTE repo (AGENTS.md y sus enlaces CLAUDE.md,
  # GEMINI.md y codex.md) lo cambia una persona. No va en la política distribuida: en un repo
  # consumidor, su AGENTS.md es suyo (tercera revisión de git-gates, P3-3).
  - id: protect-agents-md
    tool: Bash|Edit|Write|MultiEdit|NotebookEdit
    path_re: (AGENTS|CLAUDE|GEMINI|codex)\.md$
    mode: block
    reason: El mapa de instrucciones de los agentes de este repo lo cambia una persona en un cambio OpenSpec revisado
